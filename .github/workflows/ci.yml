# SPDX-License-Identifier: Apache-2.0
name: ci
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      # jsonschema cross-checks the SDK's own validator in the tests. It is never a runtime
      # dependency; with this set, the tests fail instead of skipping when it is missing.
      BOLLARD_SDK_REQUIRE_JSONSCHEMA: "1"
      # PyYAML cross-checks the routine manifest reader the same way: test-only, required here.
      BOLLARD_SDK_REQUIRE_PYYAML: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python tools/sync_spec.py check
      - run: python tools/generate.py --check
      - run: pip install "jsonschema>=4.18" pyyaml
      - run: python -m unittest discover -s tests -v
      - run: pip install . && python -c "import bollardeck; print(bollardeck.__version__)"
      - run: python -c "import bollardeck.schema as s; assert s.validate('licence', {'scope':'full'}) == [], 'installed package cannot validate'; print(s.names())"
      - run: python examples/device_on_sim.py
      - name: the installed package carries the device layer
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'EOF'
          from bollardeck.device import hal, identity, keymap
          from bollardeck.routines import RoutineSet, sim
          assert hal.board("sim").maker_code == "SIM"
          assert identity.is_registered_maker("UNOQ")
          assert keymap.resolve("hold3").action == "power"
          assert sim.run_song(RoutineSet([]))["plan"].total_bars == 28
          print("device layer ok")
          EOF
      - run: node --test tests/js/*.test.js
